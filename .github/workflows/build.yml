name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -PcoreOnly build --console=plain
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - run: ./gradlew build --console=plain
      - run: ./gradlew :mod:runGameTestServer --console=plain
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tfc-wildlife-ai-remaster
          path: mod/build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            core/build/reports/tests/test
            core/build/test-results/test
            run/gametest/logs/latest.log
