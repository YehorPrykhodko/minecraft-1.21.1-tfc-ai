plugins { id 'java-library' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.11.0'
}
test {
    useJUnitPlatform()
    workingDir rootProject.projectDir
    testLogging { events 'passed', 'skipped', 'failed'; exceptionFormat = 'full' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
