plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.148' }
java { toolchain.languageVersion = JavaLanguageVersion.of(21); withSourcesJar() }
base { archivesName = 'tfc-wildlife-ai-remaster' }
repositories {
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('../run/client') }
        server { server(); programArgument '--nogui'; gameDirectory = file('../run/server') }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('../run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'tfc_wildlife_ai'
            systemProperty 'mixin.debug.verbose', 'true'
        }
    }
    mods { tfc_wildlife_ai { sourceSet sourceSets.main; sourceSet project(':core').sourceSets.main } }
}
dependencies {
    implementation project(':core')
    if (providers.gradleProperty('tfcJar').isPresent()) {
        implementation files(providers.gradleProperty('tfcJar').get())
    } else {
        implementation "maven.modrinth:terrafirmacraft:${tfc_version}"
    }
    runtimeOnly "maven.modrinth:patchouli:${patchouli_version}"
    compileOnly "maven.modrinth:tacz-1.21.1:${tacz_version}"
    runtimeOnly "maven.modrinth:tacz-1.21.1:${tacz_version}"
}
tasks.named('jar') {
    from project(':core').sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.FAIL
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    manifest { attributes 'Implementation-Version': project.version }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}
tasks.register('validateRuntimeMods') {
    dependsOn project(':core').tasks.named('jar')
    doLast {
        def jars = configurations.runtimeClasspath.files.findAll { it.name.endsWith('.jar') }
        def counts = [tfc: 0, tacz: 0, patchouli: 0]
        jars.each { jar ->
            if (!jar.isFile()) throw new GradleException("Missing runtime JAR: ${jar}")
            def metadata = zipTree(jar).matching { include 'META-INF/neoforge.mods.toml'; include 'META-INF/mods.toml' }.files
            metadata.each { toml ->
                def blocks = (toml.text =~ /(?ms)^\s*\[\[mods\]\]\s*(.*?)(?=^\s*\[\[|\z)/).collect { it[1] }
                def declared = blocks.collectMany { block ->
                    (block =~ /(?m)^\s*modId\s*=\s*["']([^"']+)["']/).collect { it[1] }
                }
                if (declared.contains('tfc_wildlife_ai')) throw new GradleException('Remove the old Wildlife JAR from local-deps.')
                counts.keySet().each { id -> if (declared.contains(id)) counts[id]++ }
            }
        }
        counts.each { id, count ->
            if (count != 1) throw new GradleException("Expected one ${id} runtime JAR; found ${count}. See docs/BUILD_RU.md.")
        }
    }
}
tasks.matching { it.name in ['runClient', 'runServer', 'runGameTestServer'] }.configureEach { dependsOn 'validateRuntimeMods' }
